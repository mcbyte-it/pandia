blank_issues_enabled: false
contact_links:
  - name: Question or help using Pandia
    url: https://github.com/hendurhance/pandia/discussions/categories/q-a
    about: Not sure whether it's a bug? Ask here first — it's faster than an issue.
  - name: Half-formed idea
    url: https://github.com/hendurhance/pandia/discussions/categories/ideas
    about: Float a feature before it's concrete enough for a request. Ideas with traction become issues.
  - name: Documentation
    url: https://www.pandia.app/docs
    about: How views, diff, type generation, and schema validation work.
  - name: Report a security vulnerability
    url: https://github.com/hendurhance/pandia/security/advisories/new
    about: Private disclosure. Do not open a public issue for security problems.
